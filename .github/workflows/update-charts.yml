name: Atualizar Gráficos Antropométricos

on:
  schedule:
    - cron: '0 23 */14 * 6'
  workflow_dispatch:

jobs:
  update-charts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: 'release'
        use-public-rspm: true

    - name: Install R dependencies
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        cache-version: 2
        packages: |
          any::googlesheets4
          any::googledrive
          any::ggplot2
          any::dplyr
          any::lubridate
          any::jsonlite
          any::RColorBrewer
          any::tidyr

    - name: Create auth token file
      run: |
        echo '${{ secrets.GOOGLE_SHEETS_TOKEN }}' > auth_token.json

    - name: Generate charts
      run: source("generate_charts.R")
      shell: Rscript {0}

    - name: Update HTML with latest data
      run: |
        echo "Charts updated at $(date)" > charts/last_update.txt

    - name: Commit and Push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
        git add charts/
        git diff --staged --quiet || git commit -m "Atualização automática dos gráficos - $(date '+%Y-%m-%d %H:%M')"
        git pull --rebase origin main
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
